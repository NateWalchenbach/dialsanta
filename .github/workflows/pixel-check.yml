# Visits the live site in a real Chromium from a GitHub runner and prints every request the
# Meta Pixel makes. Manual only; useful because the office network cannot reach dialsanta.app.
name: Pixel check
on:
  workflow_dispatch:
jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Visit as a US visitor, then as a European visitor who allows
        run: |
          cat > pixel-check.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ args: ['--disable-blink-features=AutomationControlled'] }); // fbevents.js stays silent when navigator.webdriver is true
          async function visit(tz, allow) {
            const ctx = await browser.newContext({ timezoneId: tz, locale: 'en-US' });
            const page = await ctx.newPage();
            const hits = [];
            page.on('request', r => { const u = r.url(); if (/facebook\.com\/tr|fbevents\.js/.test(u)) hits.push(u); });
            await page.goto('https://dialsanta.app/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(2000);
            const state = () => page.evaluate(() => ({ webdriver: navigator.webdriver, fbq: typeof window.fbq, bannerVisible: !document.querySelector('[data-ads-banner]').hidden, footer: document.querySelector('.ads-choice [data-ads-state]').textContent, stored: localStorage.getItem('dialsanta.website.ads') }));
            const before = await state();
            const afterLoadHits = hits.length;
            if (allow) { await page.click('[data-ads-banner] [data-ads-allow]'); await page.waitForTimeout(3000); }
            await page.evaluate(() => document.addEventListener('click', e => { if (e.target.closest('a[href*="apps.apple.com"]')) e.preventDefault(); }));
            await page.click('a.download-button[data-download="hero"]');
            await page.waitForTimeout(3000);
            const after = await state();
            const summary = hits.map(u => { const q = new URL(u); return { host: q.host, path: q.pathname, id: q.searchParams.get('id'), ev: q.searchParams.get('ev'), dl: q.searchParams.get('dl'), placement: q.searchParams.get('cd[placement]'), dpo: q.searchParams.get('dpo') }; });
            console.log('RESULT ' + JSON.stringify({ tz, before, requestsBeforeChoice: afterLoadHits, after, hits: summary }));
            await ctx.close();
          }
          await visit('America/Los_Angeles', false);
          await visit('Europe/Berlin', true);
          await browser.close();
          JS
          node pixel-check.mjs
